name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. For security issues, please
        follow [SECURITY.md](../blob/main/SECURITY.md) instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I click a topic on /frontend, the popup…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm start`
        2. Open http://localhost:4177/#/roadmap/frontend
        3. Click …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Roadmap canvas / renderer fidelity
        - Mindmap or Universe view
        - Dashboard / stats
        - Dailys / LeetCode / Study plans
        - Connectors / Vault / integrations
        - API server
        - Build / tooling
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The commit hash, tag, or date you are running.
      placeholder: main @ 1a2b3c4
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Node version.
      placeholder: Windows 11, Node 22.23.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant console/server output. Redact credentials.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I removed any personal data or credentials from the report.
          required: true
