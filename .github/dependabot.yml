version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor + patch only. Major bumps (React 19, TS 7, Vite 8…) are breaking
    # changes that should be upgraded deliberately, not by a bot.
    allow:
      - dependency-type: direct
        update-type: "version-update:semver-minor"
      - dependency-type: direct
        update-type: "version-update:semver-patch"

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
        update-type: "version-update:semver-minor"
      - dependency-type: direct
        update-type: "version-update:semver-patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
        update-type: "version-update:semver-minor"
      - dependency-type: direct
        update-type: "version-update:semver-patch"
